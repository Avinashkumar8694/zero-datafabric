version: '3.8'

services:
  # Master Coordinator Node
  db:
    image: citusdata/citus:latest
    container_name: datafabric-hub
    environment:
      POSTGRES_USER: fabric_admin
      POSTGRES_PASSWORD: fabric_password
      POSTGRES_DB: datafabric
    ports:
      - "5434:5432"
    # volumes:
    #   - pgdata:/var/lib/postgresql/data
    #   - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # Redis for Event Queues and Caching
  redis:
    image: redis:7-alpine
    container_name: datafabric-redis
    ports:
      - "6379:6379"

  # PostgREST for instant Data API
  postgrest:
    image: postgrest/postgrest:v12.0.0
    container_name: datafabric-postgrest
    ports:
      - "3005:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:fabric_password@db:5432/datafabric
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: "reallyreallyreallyreallyverysecret"
    depends_on:
      - db
    restart: unless-stopped

  # Kafka Stack for CDC
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: datafabric-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: datafabric-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Remote Datasource for Virtualization Testing
  remote_db:
    image: postgres:15-alpine
    container_name: datafabric-remote
    environment:
      POSTGRES_USER: remote_admin
      POSTGRES_PASSWORD: remote_password
      POSTGRES_DB: remote_warehouse
    ports:
      - "5436:5432"
    restart: unless-stopped

  # NoSQL Datasource for Federated Query Testing
  mongodb:
    image: mongo:6.0
    container_name: datafabric-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    restart: unless-stopped

  # Relational Datasource (MySQL) for Federated Query Testing
  mysql:
    image: mysql:8.0
    container_name: datafabric-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql_password
      MYSQL_DATABASE: retail
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  # Oracle Database source (Oracle Free 23c). Service name: FREEPDB1
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: datafabric-oracle
    environment:
      ORACLE_PASSWORD: oracle_password        # SYS/SYSTEM password
      APP_USER: retail                         # app schema/user the fabric connects as
      APP_USER_PASSWORD: retail_password
    ports:
      - "1521:1521"
    restart: unless-stopped

  # Search Engine for Downstream Provisioning
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: datafabric-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: datafabric-kibana
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  pgdata:
